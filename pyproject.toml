[project]
name = "job-change-prediction"
version = "0.1.0"
description = "Predict whether a big tech employee in Romania leaves their employer within 12 months"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "requests>=2.32",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["extraction"]
testpaths = ["extraction/tests"]
